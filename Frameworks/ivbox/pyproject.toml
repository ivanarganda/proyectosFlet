[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivbox"
version = "1.0.0"
description = "Implemented CLI command ivbox"
readme = "README.md"
authors = [
    { name = "Ivan Gonzalez", email = "ivanartista96@example.com" }
]
requires-python = ">=3.10"

dependencies = [
    "polars",
    "pandas",
    "numpy",
    "requests",
    "flet"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true

[project.scripts]
ivbox = "ivbox.cli.main:main"